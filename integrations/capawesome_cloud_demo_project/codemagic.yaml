workflows:
  capawesome-live-update-workflow:
    name: Publish Live Update to Capawesome Cloud
    max_build_duration: 30
    instance_type: linux_x2 # <-- A Live Update only needs the web assets, so no macOS machine is required
    environment:
      groups:
        - capawesome_credentials # <-- (Includes CAPAWESOME_TOKEN and CAPAWESOME_APP_ID)
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build web assets
        script: |
          npm run build
      - name: Create channel (no-op if it already exists)
        script: |
          npx @capawesome/cli apps:channels:create \
            --app-id $CAPAWESOME_APP_ID \
            --name production \
            --ignore-errors
      - name: Upload Live Update to Capawesome Cloud
        script: |
          # The CLI authenticates with the CAPAWESOME_TOKEN environment variable.
          # --git-ref links the bundle to the commit it was built from.
          npx @capawesome/cli apps:liveupdates:upload \
            --app-id $CAPAWESOME_APP_ID \
            --path dist \
            --channel production \
            --git-ref $CM_COMMIT
    publishing:
      email:
        recipients:
          - user_one@example.com
          - user_two@example.com
        notify:
          success: true
          failure: true
